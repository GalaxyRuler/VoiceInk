name: Windows Installer Smoke

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Self-hosted Windows runner label for disposable installer smoke.
        required: true
        default: voiceink-windows-qa
      signed_package_path:
        description: Path to a signed .msix already present on the runner or checked-out artifact workspace.
        required: true
      main_package_uri:
        description: Absolute URI to write into the optional .appinstaller MainPackage entry.
        required: false
        default: https://example.invalid/VoiceInk.Windows_0.1.0.0_x64.msix
      appinstaller_path:
        description: Optional artifact-local .appinstaller output path.
        required: false
        default: VoiceInk.Windows\artifacts\gha-installer-smoke\VoiceInk.Windows.appinstaller
      wack_report_path:
        description: Optional artifact-local Windows App Certification Kit report path.
        required: false
        default: VoiceInk.Windows\artifacts\gha-installer-smoke\wack-report.xml
      execute_install_smoke:
        description: Run Add-AppxPackage/Get-AppxPackage/Remove-AppxPackage on the disposable runner.
        required: true
        type: boolean
        default: false
      run_wack:
        description: Run Windows App Certification Kit against the signed package on the disposable runner.
        required: true
        type: boolean
        default: false
      run_gui_smoke:
        description: Launch VoiceInk, capture GUI evidence, and uninstall on the disposable runner. Requires execute_install_smoke.
        required: true
        type: boolean
        default: false

jobs:
  installer-smoke:
    name: Signed MSIX and App Installer smoke
    runs-on:
      - self-hosted
      - windows
      - ${{ inputs.runner_label }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          $evidenceRoot = "VoiceInk.Windows\artifacts\gha-installer-smoke"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          @(
            "VoiceInk Windows installer smoke evidence"
            "Signed package path: ${{ inputs.signed_package_path }}"
            "App Installer path: ${{ inputs.appinstaller_path }}"
            "Install smoke executed: ${{ inputs.execute_install_smoke }}"
            "Windows App Certification Kit requested: ${{ inputs.run_wack }}"
            "WACK report path: ${{ inputs.wack_report_path }}"
            "GUI smoke requested: ${{ inputs.run_gui_smoke }}"
            "GUI smoke log: gui-smoke-log.txt"
            "GUI smoke window evidence: gui-smoke-window.json"
            "GUI smoke screenshot: gui-smoke-screenshot.png"
            "No signing certificates are created or imported by this workflow."
          ) | Set-Content -LiteralPath (Join-Path $evidenceRoot "installer-smoke-summary.txt") -Encoding UTF8

      - name: Stage signed MSIX package
        shell: pwsh
        run: |
          $evidenceRoot = "VoiceInk.Windows\artifacts\gha-installer-smoke"
          $stagedPackagePath = Join-Path $evidenceRoot "VoiceInk.Windows.signed.msix"
          $sourcePackagePath = (Resolve-Path -LiteralPath "${{ inputs.signed_package_path }}").Path
          Copy-Item -LiteralPath $sourcePackagePath -Destination $stagedPackagePath -Force
          "Staged signed package path: $stagedPackagePath" |
            Add-Content -LiteralPath (Join-Path $evidenceRoot "installer-smoke-summary.txt") -Encoding UTF8

      - name: Validate GUI smoke inputs
        if: ${{ inputs.run_gui_smoke && !inputs.execute_install_smoke }}
        shell: pwsh
        run: |
          throw "run_gui_smoke requires execute_install_smoke because GUI smoke installs, launches, captures evidence, and uninstalls the signed package on the disposable runner."

      - name: Validate signed MSIX package contents
        shell: pwsh
        run: |
          .\VoiceInk.Windows\scripts\test-msix-package.ps1 -PackagePath "VoiceInk.Windows\artifacts\gha-installer-smoke\VoiceInk.Windows.signed.msix"

      - name: Run Windows App Certification Kit
        if: ${{ inputs.run_wack }}
        shell: pwsh
        run: |
          $wackRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit"
          $appCert = Join-Path $wackRoot "appcert.exe"
          if (!(Test-Path -LiteralPath $appCert)) {
            throw "Windows App Certification Kit appcert.exe was not found at $appCert."
          }

          $packagePath = (Resolve-Path -LiteralPath "VoiceInk.Windows\artifacts\gha-installer-smoke\VoiceInk.Windows.signed.msix").Path
          $reportPath = [System.IO.Path]::GetFullPath("${{ inputs.wack_report_path }}")
          $reportDirectory = Split-Path -Parent $reportPath
          New-Item -ItemType Directory -Force -Path $reportDirectory | Out-Null

          Push-Location $wackRoot
          try {
            & $appCert reset
            if ($LASTEXITCODE -ne 0) {
              throw "Windows App Certification Kit reset failed with exit code $LASTEXITCODE."
            }

            & $appCert test -appxpackagepath $packagePath -reportoutputpath $reportPath
            if ($LASTEXITCODE -ne 0) {
              throw "Windows App Certification Kit test failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Generate optional App Installer manifest
        shell: pwsh
        run: |
          .\VoiceInk.Windows\scripts\write-appinstaller.ps1 `
            -MainPackageUri "${{ inputs.main_package_uri }}" `
            -OutputPath "${{ inputs.appinstaller_path }}"

      - name: Validate optional App Installer manifest
        shell: pwsh
        run: |
          .\VoiceInk.Windows\scripts\test-appinstaller.ps1 -AppInstallerPath "${{ inputs.appinstaller_path }}"

      - name: Signed install smoke plan
        shell: pwsh
        run: |
          .\VoiceInk.Windows\scripts\smoke-msix-install.ps1 -PackagePath "VoiceInk.Windows\artifacts\gha-installer-smoke\VoiceInk.Windows.signed.msix"

      - name: Execute signed install smoke
        if: ${{ inputs.execute_install_smoke && !inputs.run_gui_smoke }}
        shell: pwsh
        run: |
          .\VoiceInk.Windows\scripts\smoke-msix-install.ps1 -PackagePath "VoiceInk.Windows\artifacts\gha-installer-smoke\VoiceInk.Windows.signed.msix" -Execute

      - name: Execute signed GUI smoke
        if: ${{ inputs.execute_install_smoke && inputs.run_gui_smoke }}
        shell: pwsh
        run: |
          .\VoiceInk.Windows\scripts\smoke-msix-gui.ps1 `
            -PackagePath "VoiceInk.Windows\artifacts\gha-installer-smoke\VoiceInk.Windows.signed.msix" `
            -EvidenceRoot "VoiceInk.Windows\artifacts\gha-installer-smoke"

      - name: Safety boundary
        shell: pwsh
        run: |
          Write-Host "No signing certificates are created or imported by this workflow."
          Write-Host "The install step runs only when execute_install_smoke is true on a disposable self-hosted Windows runner."
          Write-Host "The Windows App Certification Kit step runs only when run_wack is true in an active user session."
          Write-Host "The GUI smoke step runs only when execute_install_smoke and run_gui_smoke are both true on a disposable self-hosted Windows runner."
          Write-Host "GUI evidence files: gui-smoke-log.txt, gui-smoke-window.json, gui-smoke-screenshot.png."

      - name: Upload installer smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke-evidence
          path: VoiceInk.Windows\artifacts\gha-installer-smoke
          if-no-files-found: warn
          include-hidden-files: false
